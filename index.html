<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Clone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body class="body">

    <!-- Header -->
    <div class="header">

        <!-- Left Section -->
        <div class="left-section">

            <img
                class="hamburger-menu"
                src="images/hamburger-menu.svg"
                alt="Menu"
            >

            <img
                class="youtube-logo"
                src="images/youtube-logo.svg"
                alt="YouTube"
            >

        </div>


        <!-- Middle Section -->
        <div class="middle-section">

            <input
                class="Search-bar"
                id="searchBar"
                type="text"
                placeholder="Search"
                aria-label="Search"
            >

            <button class="search-button" type="button">

                <img
                    class="search-icon"
                    src="images/search.svg"
                    alt="Search"
                >

                <div class="tooltip">
                    Search
                </div>

            </button>


            <button class="voice-search-icon" type="button">

                <img
                    class="voice-search"
                    src="images/voice-search-icon.svg"
                    alt="Voice search"
                >

                <div class="tooltip">
                    Search with your voice
                </div>

            </button>

        </div>


        <!-- Right Section -->
        <div class="right-section">

            <div class="upload-icon-container">

                <img
                    class="upload-icon"
                    src="images/upload.svg"
                    alt="Create"
                >

                <div class="tooltip">
                    Create
                </div>

            </div>


            <img
                class="youtube-apps-icon"
                src="images/youtube-apps.svg"
                alt="YouTube apps"
            >


            <div class="notifications-icon-container">

                <img
                    class="notifications-icon"
                    src="images/notifications.svg"
                    alt="Notifications"
                >

                <div class="notifications-count">
                    3
                </div>

            </div>


            <img
                class="current-user-icon"
                src="images/channel-136.jpg"
                alt="Your profile"
            >

        </div>

    </div>


    <!-- Sidebar -->
    <div class="sidebar">

        <div class="sidebar-link">
            <img src="images/home.svg" alt="Home">
            <div>Home</div>
        </div>

        <div class="sidebar-link">
            <img src="images/explore.svg" alt="Explore">
            <div>Explore</div>
        </div>

        <div class="sidebar-link">
            <img src="images/subscriptions.svg" alt="Subscriptions">
            <div>Subscriptions</div>
        </div>

        <div class="sidebar-link">
            <img src="images/originals.svg" alt="Originals">
            <div>Originals</div>
        </div>

        <div class="sidebar-link">
            <img src="images/youtube-music.svg" alt="YouTube Music">
            <div>YouTube Music</div>
        </div>

        <div class="sidebar-link">
            <img src="images/library.svg" alt="Library">
            <div>Library</div>
        </div>

    </div>


    <!-- Video Grid -->
    <!-- JavaScript will generate all 100+ videos here -->
    <div class="video-grid" id="videoGrid"></div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
